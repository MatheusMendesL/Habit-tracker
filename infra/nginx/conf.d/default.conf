upstream auth_service {
    server auth-service:3000;
}

upstream user_service {
    server user-service:8080;
}

upstream social_service {
    server social-service:8081;
}

upstream habit_service {
    server habit-service:8082;
}

upstream stats_service {
    server stats-service:8083;
}

server {

    listen 80;

    # adicionar outras rotas finais dps

    location /api/v1/auth/ {
        rewrite ^/api/v1/auth/?(.*)$ /$1 break;
        proxy_pass http://auth_service;
    }

    location /api/v1/user/ {
        rewrite ^/api/v1/user/?(.*)$ /$1 break;
        proxy_pass http://user_service;
    }

    location /api/v1/social/ {
        rewrite ^/api/v1/social/?(.*)$ /$1 break;
        proxy_pass http://social_service;
    }

    location /api/v1/habit/ {
        rewrite ^/api/v1/habit/?(.*)$ /$1 break;
        proxy_pass http://habit_service;
    }

    location /api/v1/routine/ {
        rewrite ^/api/v1/routine/?(.*)$ /$1 break;
        proxy_pass http://habit_service;
    }

    location /api/v1/stats/ {
        rewrite ^/api/v1/stats/?(.*)$ /$1 break;
        proxy_pass http://stats_service;
    }

}