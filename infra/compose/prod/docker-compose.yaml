services:
  redis:
    image: redis:7
    restart: unless-stopped

  auth-service:
    restart: unless-stopped

    build:
      context: ${ROUTE_DOCKER}/auth-service
      dockerfile: Dockerfile

    env_file:
      - ${ROUTE_DOCKER}/auth-service/.env

    depends_on:
      - redis

  user-service:
    restart: unless-stopped

    build:
      context: ${ROUTE_ROOT}
      dockerfile: backend/services/user-service/Dockerfile

    env_file:
      - ${ROUTE_DOCKER}/user-service/.env

    environment:
      SERVICE_NAME: user-service

    volumes:
      - ${ROUTE_DOCKER}/user-service/cert:/app/cert:ro

  social-service:
    restart: unless-stopped

    build:
      context: ${ROUTE_ROOT}
      dockerfile: backend/services/social-service/Dockerfile

    env_file:
      - ${ROUTE_DOCKER}/social-service/.env

    environment:
      SERVICE_NAME: social-service
      USER_SERVICE_ADDR: user-service:8080

    volumes:
      - ${ROUTE_DOCKER}/social-service/cert:/app/cert:ro

    depends_on:
      - user-service

  habit-service:
    restart: unless-stopped

    build:
      context: ${ROUTE_ROOT}
      dockerfile: backend/services/habit-service/Dockerfile

    env_file:
      - ${ROUTE_DOCKER}/habit-service/.env

    environment:
      SERVICE_NAME: habit-service
      USER_SERVICE_ADDR: user-service:8080

    volumes:
      - ${ROUTE_DOCKER}/habit-service/cert:/app/cert:ro

    depends_on:
      - user-service

  stats-service:
    restart: unless-stopped

    build:
      context: ${ROUTE_ROOT}
      dockerfile: backend/services/stats-service/Dockerfile

    env_file:
      - ${ROUTE_DOCKER}/stats-service/.env

    environment:
      SERVICE_NAME: stats-service
      USER_SERVICE_ADDR: user-service:8080
      HABIT_SERVICE_ADDR: habit-service:8082

    volumes:
      - ${ROUTE_DOCKER}/stats-service/cert:/app/cert:ro

    depends_on:
      - habit-service
      - user-service

  gateway:
    restart: unless-stopped

    build:
      context: ${ROUTE_ROOT}/backend
      dockerfile: gateway/Dockerfile

    env_file:
      - ${ROUTE_ROOT}/backend/gateway/.env

    environment:
      SERVICE_NAME: gateway
      PORT: ":8084"
      USER_SERVICE_ADDR: user-service:8080
      SOCIAL_SERVICE_ADDR: social-service:8081
      HABIT_SERVICE_ADDR: habit-service:8082
      STATS_SERVICE_ADDR: stats-service:8083
      TLS_CA_CERT_PATH: /app/cert/ca-cert.pem

    ports:
      - "8084:8084/tcp"

    depends_on:
      - user-service
      - social-service
      - habit-service
      - stats-service

  nginx:
    restart: unless-stopped

    build:
      context: ../../nginx
      dockerfile: Dockerfile

    ports:
      - "80:80"

    depends_on:
      - auth-service
      - gateway
      - user-service
      - social-service
      - habit-service
      - stats-service