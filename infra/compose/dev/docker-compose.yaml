version: "3.9"

services:
  redis:
    image: redis:7

    ports:
      - "6379:6379/tcp"

  auth-service:
    build:
      context: ${ROUTE_DOCKER}/auth-service
      dockerfile: Dockerfile

    env_file:
      - ${ROUTE_DOCKER}/auth-service/.env

    volumes:
      - ${ROUTE_DOCKER}/auth-service:/app
      - /app/node_modules

    ports:
      - "3000:3000/tcp"

    depends_on:
      - redis

  user-service:
    build:
      context: ${ROUTE_DOCKER}/user-service
      dockerfile: Dockerfile.dev

    env_file:
      - ${ROUTE_DOCKER}/user-service/.env

    environment:
      SERVICE_NAME: user-service
      TYPE: tcp
      PORT: ":8080"

    volumes:
      - ${ROUTE_DOCKER}/user-service:/app

    ports:
      - "8080:8080/tcp"

  social-service:
    build:
      context: ${ROUTE_DOCKER}/social-service
      dockerfile: Dockerfile.dev

    env_file:
      - ${ROUTE_DOCKER}/social-service/.env

    environment:
      SERVICE_NAME: social-service
      TYPE: tcp
      PORT: ":8081"

    volumes:
      - ${ROUTE_DOCKER}/social-service:/app

    ports:
      - "8081:8081/tcp"

    depends_on:
      - user-service

  habit-service:
    build:
      context: ${ROUTE_DOCKER}/habit-service
      dockerfile: Dockerfile.dev

    env_file:
      - ${ROUTE_DOCKER}/habit-service/.env

    environment:
      SERVICE_NAME: habit-service
      TYPE: tcp
      PORT: ":8082"

    volumes:
      - ${ROUTE_DOCKER}/habit-service:/app

    ports:
      - "8082:8082/tcp"

    depends_on:
      - user-service

  stats-service:
    build:
      context: ${ROUTE_DOCKER}/stats-service
      dockerfile: Dockerfile.dev

    env_file:
      - ${ROUTE_DOCKER}/stats-service/.env

    environment:
      SERVICE_NAME: stats-service
      TYPE: tcp
      PORT: ":8083"

    volumes:
      - ${ROUTE_DOCKER}/stats-service:/app

    ports:
      - "8083:8083/tcp"

    depends_on:
      - habit-service
      - user-service

  nginx:
    build:
      context: ../../nginx
      dockerfile: Dockerfile

    ports:
      - "80:80/tcp"

    depends_on:
      - auth-service
      - user-service
      - social-service
      - habit-service
      - stats-service