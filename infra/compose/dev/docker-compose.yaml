version: "3.9"

services:
  redis:
    image: redis:7

    ports:
      - "6379:6379"

  auth-service:
    build:
      context: ${ROUTE_DOCKER}/auth-service
      dockerfile: Dockerfile

    env_file:
      - ${ROUTE_DOCKER}/auth-service/.env

    volumes:
      - ${ROUTE_DOCKER}/auth-service:/app
      - /app/node_modules

    ports:
      - "3000:3000"

    depends_on:
      - redis

  user-service:
    build:
      context: ${ROUTE_DOCKER}/user-service
      dockerfile: Dockerfile.dev

    env_file:
      - ${ROUTE_DOCKER}/user-service/.env

    volumes:
      - ${ROUTE_DOCKER}/user-service:/app

    ports:
      - "8080:8080"

  social-service:
    build:
      context: ${ROUTE_DOCKER}/social-service
      dockerfile: Dockerfile.dev

    env_file:
      - ${ROUTE_DOCKER}/social-service/.env

    volumes:
      - ${ROUTE_DOCKER}/social-service:/app

    ports:
      - "8081:8081"

    depends_on:
      - user-service

  habit-service:
    build:
      context: ${ROUTE_DOCKER}/habit-service
      dockerfile: Dockerfile.dev

    env_file:
      - ${ROUTE_DOCKER}/habit-service/.env

    volumes:
      - ${ROUTE_DOCKER}/habit-service:/app

    ports:
      - "8082:8082"

    depends_on:
      - user-service

  stats-service:
    build:
      context: ${ROUTE_DOCKER}/stats-service
      dockerfile: Dockerfile.dev

    env_file:
      - ${ROUTE_DOCKER}/stats-service/.env

    volumes:
      - ${ROUTE_DOCKER}/stats-service:/app

    ports:
      - "8083:8083"

    depends_on:
      - habit-service
      - user-service

  nginx:
    build:
      context: ../../nginx
      dockerfile: Dockerfile

    ports:
      - "80:80"

    depends_on:
      - auth-service
      - user-service
      - social-service
      - habit-service
      - stats-service