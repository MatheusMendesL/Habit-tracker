#:schema https://json.schemastore.org/any.json

env_files = []
root = "."
tmp_dir = "tmp"
testdata_dir = "testdata"

[build]
bin = "tmp/main.exe"
cmd = "go build -o ./tmp/main.exe ./cmd"
delay = 1000

exclude_dir = [
  "tmp",
  "vendor",
  "testdata",
  ".idea",
  "cert"
]

exclude_file = []
exclude_regex = ["_test.go"]
exclude_unchanged = false
follow_symlink = false
full_bin = ""

include_dir = []
include_ext = ["go", "tpl", "tmpl", "html"]
include_file = []

kill_delay = "0s"
log = "build-errors.log"

poll = false
poll_interval = 0

post_cmd = []
pre_cmd = []

rerun = false
rerun_delay = 500

send_interrupt = false
stop_on_error = true

[color]
app = ""
build = "yellow"
main = "magenta"
runner = "green"
watcher = "cyan"

[log]
main_only = false
silent = false
time = true

[misc]
clean_on_exit = true

[screen]
clear_on_rebuild = true
keep_scroll = true