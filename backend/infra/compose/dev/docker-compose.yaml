services:
  redis:
    image: redis:7
    ports:
      - "6379:6379"

  auth-service:
    build:
      context: ../../../auth-services-node
      dockerfile: Dockerfile

    env_file:
      - ../../../auth-services-node/.env

    volumes:
      - ../../../auth-services-node:/app
      - /app/node_modules

    ports:
      - "3000:3000"

    depends_on:
      - redis

  user-service:
    env_file:
      - ../../../services/user-service/.env
    build:
      context: ../../../services/user-service
      dockerfile: Dockerfile.dev

    volumes:
      - ../../../services/user-service:/app

    ports:
      - "8080:8080"

  social-service:
    env_file:
      - ../../../services/social-service/.env

    build:
      context: ../../../services/social-service
      dockerfile: Dockerfile.dev

    volumes:
      - ../../../services/social-service:/app

    ports:
      - "8081:8081"

    depends_on:
      - user-service

  habit-service:
    env_file:
      - ../../../services/habit-service/.env

    build:
      context: ../../../services/habit-service
      dockerfile: Dockerfile.dev

    volumes:
      - ../../../services/habit-service:/app

    ports:
      - "8082:8082"

    depends_on:
      - user-service

  stats-service:
    env_file:
      - ../../../services/stats-service/.env
    
    build:
      context: ../../../services/stats-service
      dockerfile: Dockerfile.dev
    
    volumes:
      - ../../../services/stats-service:/app
    
    ports:
      - "8082:8082"
    
    depends_on:
      - habit-service
      - user-service
  # por os serviços que faltam dps aqui e no nginx

  nginx:
    build:
      context: ../../nginx

    ports:
      - "80:80"

    depends_on:
      - auth-service
      - user-service
      - social-service
      - habit-service
      - stats-service